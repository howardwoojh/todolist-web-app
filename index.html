<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide@latest">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f9fafb;
            color: #111827;
        }
        .btn-primary {
            padding: 0.5rem 1rem;
            background-color: #3b82f6;
            color: white;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .btn-secondary {
            padding: 0.5rem 1rem;
            background-color: #f3f4f6;
            color: #111827;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            padding: 1rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .task-item {
            background-color: white;
            border-radius: 0.5rem;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
        }
        .task-item.high-priority {
            border-left-color: #ef4444;
        }
        .task-item.medium-priority {
            border-left-color: #eab308;
        }
        .task-item.low-priority {
            border-left-color: #d1d5db;
        }
        .task-item.completed {
            opacity: 0.6;
        }
        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #9ca3af;
        }
        .priority-high {
            color: #ef4444;
        }
        .priority-medium {
            color: #eab308;
        }
        .priority-low {
            color: #9ca3af;
        }
        .category-work {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .category-study {
            background-color: #e9d5ff;
            color: #6b21a8;
        }
        .category-personal {
            background-color: #dcfce7;
            color: #15803d;
        }
        .category-other {
            background-color: #f3f4f6;
            color: #374151;
        }
        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .sidebar-item {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .sidebar-item:hover {
            background-color: #f3f4f6;
        }
        .sidebar-item.active {
            background-color: #dbeafe;
            color: #1e40af;
            font-weight: 600;
        }
        .stats-card {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            border-radius: 0.75rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background-color: white;
            border-radius: 0.75rem;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.15);
        }
        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6b7280;
        }
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r border-gray-200 p-6 fixed h-full overflow-y-auto">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-blue-600">✓ Todo</h1>
                <p class="text-sm text-gray-500 mt-1">Modern Task Manager</p>
            </div>

            <!-- Stats -->
            <div class="mb-8">
                <div class="stats-card">
                    <div class="text-3xl font-bold" id="totalTasks">5</div>
                    <div class="text-sm text-blue-100">Total Tasks</div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="space-y-2">
                <div class="sidebar-item active" onclick="switchPage('my-tasks')">
                    <div class="font-medium">📋 My Tasks</div>
                </div>
                <div class="sidebar-item" onclick="switchPage('today')">
                    <div class="font-medium">☀️ Today</div>
                </div>
                <div class="sidebar-item" onclick="switchPage('upcoming')">
                    <div class="font-medium">📅 Upcoming</div>
                </div>
                <div class="sidebar-item" onclick="switchPage('completed')">
                    <div class="font-medium">✔️ Completed</div>
                </div>
            </nav>

            <!-- Priority Filter -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <h3 class="text-sm font-semibold text-gray-700 mb-3">PRIORITY</h3>
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="checkbox" checked onchange="filterTasks()" class="w-4 h-4 text-red-500">
                        <span class="ml-2 text-sm">🔴 High Priority</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" checked onchange="filterTasks()" class="w-4 h-4 text-yellow-500">
                        <span class="ml-2 text-sm">🟡 Medium Priority</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" checked onchange="filterTasks()" class="w-4 h-4 text-gray-400">
                        <span class="ml-2 text-sm">⚪ Low Priority</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="ml-64 flex-1">
            <!-- Header -->
            <div class="bg-white border-b border-gray-200 p-6 sticky top-0 z-50">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 id="pageTitle" class="text-3xl font-bold text-gray-900">My Tasks</h2>
                        <p id="pageDescription" class="text-gray-500 mt-1">Manage your tasks efficiently</p>
                    </div>
                    <button class="btn-primary" onclick="openAddTaskModal()">+ Add Task</button>
                </div>
            </div>

            <!-- Tasks Container -->
            <div class="p-6">
                <div id="tasksContainer" class="space-y-0">
                    <!-- Tasks will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add New Task</div>
            
            <div class="form-group">
                <label>Task Title *</label>
                <input type="text" id="taskTitle" placeholder="Enter task title" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="taskDescription" placeholder="Enter task description (optional)"></textarea>
            </div>

            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="taskDueDate">
            </div>

            <div class="form-group">
                <label>Priority</label>
                <select id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="taskCategory">
                    <option value="work">Work</option>
                    <option value="study">Study</option>
                    <option value="personal">Personal</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeTaskModal()">Cancel</button>
                <button class="btn-primary" onclick="saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script>
        // Data
        let tasks = [];
        let currentPage = 'my-tasks';
        let editingTaskId = null;
        let todayDate = new Date().toISOString().split('T')[0];

        // Demo tasks
        const demoTasks = [
            {
                id: '1',
                title: 'Finish UX Research',
                description: 'Complete user interviews and analysis',
                completed: false,
                dueDate: todayDate,
                priority: 'high',
                category: 'work',
                createdAt: new Date().toISOString()
            },
            {
                id: '2',
                title: 'Complete Figma prototype',
                description: 'Design mobile app screens',
                completed: false,
                dueDate: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                priority: 'high',
                category: 'work',
                createdAt: new Date().toISOString()
            },
            {
                id: '3',
                title: 'Prepare presentation',
                description: 'Prepare slides for client meeting',
                completed: false,
                dueDate: new Date(Date.now() + 172800000).toISOString().split('T')[0],
                priority: 'medium',
                category: 'work',
                createdAt: new Date().toISOString()
            },
            {
                id: '4',
                title: 'Review design feedback',
                completed: false,
                dueDate: todayDate,
                priority: 'medium',
                category: 'work',
                createdAt: new Date().toISOString()
            },
            {
                id: '5',
                title: 'Read AI Agent documentation',
                description: 'Study advanced AI patterns',
                completed: false,
                dueDate: new Date(Date.now() + 259200000).toISOString().split('T')[0],
                priority: 'low',
                category: 'study',
                createdAt: new Date().toISOString()
            }
        ];

        // Initialize
        function init() {
            const stored = localStorage.getItem('todo_tasks');
            tasks = stored ? JSON.parse(stored) : demoTasks;
            renderTasks();
            updateStats();
        }

        function saveTasks() {
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            let visibleTasks = tasks;

            // Filter by page
            if (currentPage === 'today') {
                visibleTasks = visibleTasks.filter(t => !t.completed && t.dueDate === todayDate);
            } else if (currentPage === 'upcoming') {
                visibleTasks = visibleTasks.filter(t => !t.completed && t.dueDate && t.dueDate > todayDate);
                visibleTasks.sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
            } else if (currentPage === 'completed') {
                visibleTasks = visibleTasks.filter(t => t.completed);
            }

            // Sort by priority
            visibleTasks.sort((a, b) => {
                const priorityOrder = { high: 3, medium: 2, low: 1 };
                return (priorityOrder[b.priority] || 0) - (priorityOrder[a.priority] || 0);
            });

            if (visibleTasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p class="text-lg font-medium">No tasks yet</p>
                        <p class="text-sm mt-2">Create your first task to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = visibleTasks.map(task => `
                <div class="task-item ${task.priority}-priority ${task.completed ? 'completed' : ''}">
                    <div class="flex-1">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                                onchange="toggleTask('${task.id}')" class="w-5 h-5">
                            <div>
                                <h3 class="task-title font-medium text-gray-900">${escapeHtml(task.title)}</h3>
                                ${task.description ? `<p class="text-sm text-gray-600 mt-1">${escapeHtml(task.description)}</p>` : ''}
                                <div class="flex gap-2 mt-2">
                                    <span class="category-badge category-${task.category}">${task.category}</span>
                                    <span class="text-xs font-semibold priority-${task.priority}">
                                        ${task.priority.toUpperCase()}
                                    </span>
                                    ${task.dueDate ? `<span class="text-xs text-gray-500">📅 ${formatDate(task.dueDate)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editTask('${task.id}')" class="btn-secondary" title="Edit">✏️</button>
                        <button onclick="deleteTask('${task.id}')" class="btn-secondary" title="Delete">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.sidebar-item').classList.add('active');

            const titles = {
                'my-tasks': { title: 'My Tasks', desc: 'Manage your tasks efficiently' },
                'today': { title: 'Today', desc: 'Tasks due today' },
                'upcoming': { title: 'Upcoming', desc: 'Tasks coming up soon' },
                'completed': { title: 'Completed', desc: 'Your completed tasks' }
            };

            document.getElementById('pageTitle').textContent = titles[page].title;
            document.getElementById('pageDescription').textContent = titles[page].desc;
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function openAddTaskModal() {
            editingTaskId = null;
            document.getElementById('modalTitle').textContent = 'Add New Task';
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDescription').value = '';
            document.getElementById('taskDueDate').value = '';
            document.getElementById('taskPriority').value = 'medium';
            document.getElementById('taskCategory').value = 'work';
            document.getElementById('taskModal').classList.add('show');
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                editingTaskId = id;
                document.getElementById('modalTitle').textContent = 'Edit Task';
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskDueDate').value = task.dueDate || '';
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskCategory').value = task.category;
                document.getElementById('taskModal').classList.add('show');
            }
        }

        function saveTask() {
            const title = document.getElementById('taskTitle').value.trim();
            if (!title) {
                alert('Task title is required');
                return;
            }

            if (editingTaskId) {
                const task = tasks.find(t => t.id === editingTaskId);
                if (task) {
                    task.title = title;
                    task.description = document.getElementById('taskDescription').value;
                    task.dueDate = document.getElementById('taskDueDate').value;
                    task.priority = document.getElementById('taskPriority').value;
                    task.category = document.getElementById('taskCategory').value;
                }
            } else {
                tasks.push({
                    id: Date.now().toString(),
                    title: title,
                    description: document.getElementById('taskDescription').value,
                    dueDate: document.getElementById('taskDueDate').value,
                    priority: document.getElementById('taskPriority').value,
                    category: document.getElementById('taskCategory').value,
                    completed: false,
                    createdAt: new Date().toISOString()
                });
            }

            saveTasks();
            closeTaskModal();
            renderTasks();
            updateStats();
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
                updateStats();
            }
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('show');
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            document.getElementById('totalTasks').textContent = total;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            if (dateStr === todayDate) return 'Today';
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            if (dateStr === tomorrow) return 'Tomorrow';
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function filterTasks() {
            renderTasks();
        }

        // Close modal when clicking outside
        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTaskModal();
            }
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
